# Application Configuration
quarkus.http.port=8779

# OpenAPI Generator Configuration
quarkus.openapi-generator.codegen.spec.pet_store_yaml.base-package=org.acme.openapiclient.petstore
# Disable security generation (we only need header propagation, not full authentication)
quarkus.openapi-generator.codegen.spec.pet_store_yaml.enable-security-generation=false
quarkus.openapi-generator.codegen.spec.pet_store_yaml.return-response=true
# Use the config-key for REST client configuration
quarkus.openapi-generator.codegen.spec.pet_store_yaml.config-key=pet_store_yaml

# Pet Store API Client Configuration
petstore.api.url=http://localhost:8080
petstore.api.connect-timeout=5000
petstore.api.read-timeout=30000
# Enable mock mode when external API is unavailable (true = always use mock data)
petstore.api.mock-mode=false

# Quarkus REST Client Configuration for generated DefaultApi (config-key: pet_store_yaml)
quarkus.rest-client.pet_store_yaml.url=${petstore.api.url}
quarkus.rest-client.pet_store_yaml.scope=jakarta.inject.Singleton
quarkus.rest-client.pet_store_yaml.connect-timeout=${petstore.api.connect-timeout}
quarkus.rest-client.pet_store_yaml.read-timeout=${petstore.api.read-timeout}

# Header Propagation using ClientRequestFilter
# Since enable-security-generation=false, we use custom filter approach
# PetStoreHeaderPropagationFilter: Propagates headers from incoming request
# PetStoreClientLoggingFilter: Logs outgoing requests for debugging
#quarkus.rest-client.pet_store_yaml.providers=org.acme.openapiclient.client.PetStoreHeaderPropagationFilter,org.acme.openapiclient.client.PetStoreClientLoggingFilter

# Logging Configuration
quarkus.console.color=true
quarkus.log.console.level=DEBUG
quarkus.log.min-level=DEBUG
quarkus.log.category."org.acme".level=DEBUG
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.category."org.jboss.resteasy.client".level=DEBUG
quarkus.log.category."org.eclipse.microprofile.rest.client".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Dev Mode Configuration
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."org.acme".level=DEBUG
%dev.quarkus.log.file.enabled=true
%dev.quarkus.log.file.level=DEBUG
%dev.quarkus.log.file.path=logs/quarkus-dev.log
%dev.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %h %N[%i] %-5p [%c{3.}.%M:%L] (%t) %s%e%n
# Enable Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# OpenAPI configuration
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Swagger Client Petstore API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=A sample Pet Store Client based on the OpenAPI 3.0 specification
